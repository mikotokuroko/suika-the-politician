<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title data-i18n="合成大迈乎">Suika the Politician</title>
    <meta
      name="description"
      content="Drop, match, and merge familiar faces in a physics-based puzzle game. Play with built-in themes or create your own photo theme."
    />
    <link
      rel="canonical"
      href="https://mikotokuroko.github.io/suika-the-politician/"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Suika the Politician" />
    <meta property="og:title" content="Suika the Politician" />
    <meta
      property="og:description"
      content="Drop, match, and merge familiar faces. Play free in your browser or create your own photo theme."
    />
    <meta
      property="og:url"
      content="https://mikotokuroko.github.io/suika-the-politician/"
    />
    <meta
      property="og:image"
      content="https://mikotokuroko.github.io/suika-the-politician/preview.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1456" />
    <meta property="og:image:height" content="730" />
    <meta
      property="og:image:alt"
      content="Suika the Politician theme selection with Mywho, Mbappé, and Macron."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Suika the Politician" />
    <meta
      name="twitter:description"
      content="Drop, match, and merge familiar faces. Play free in your browser or create your own photo theme."
    />
    <meta
      name="twitter:image"
      content="https://mikotokuroko.github.io/suika-the-politician/preview.png"
    />
    <meta
      name="twitter:image:alt"
      content="Suika the Politician theme selection with Mywho, Mbappé, and Macron."
    />
    <link rel="stylesheet" href="styles/game.css" />
    <script src="scripts/i18n.js"></script>
    <script src="scripts/region-check.js"></script>
    <script
      data-goatcounter="https://mywho.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <section
      id="theme-screen"
      class="theme-screen"
      aria-labelledby="theme-heading"
    >
      <div class="theme-panel">
        <label class="language-control" for="language"
          ><span data-i18n="语言">语言</span
          ><select id="language" class="language-select">
            <option value="zh">中文</option>
            <option value="fr">Français</option>
            <option value="en">English</option>
          </select></label
        >
        <p class="eyebrow" data-i18n="合成大迈乎">合成大迈乎</p>
        <h1 id="theme-heading" data-i18n="选择你的合成主题">
          选择你的合成主题
        </h1>
        <div id="theme-options" class="theme-options"></div>
        <button
          type="button"
          id="customize"
          class="primary-button"
          data-i18n="＋ 自定义照片主题"
        >
          ＋ 自定义照片主题
        </button>
        <p id="theme-status" role="status"></p>
        <form id="custom-form" hidden>
          <h2 data-i18n="制作你的主题">制作你的主题</h2>
          <p
            data-i18n="每个等级对应一张照片，按从小到大排列。照片仅在本浏览器中处理，本次打开期间保留。"
          >
            每个等级对应一张照片，按从小到大排列。照片仅在本浏览器中处理，本次打开期间保留。
          </p>
          <label for="level-count" data-i18n="等级数量（2–15）"
            >等级数量（2–15）</label
          >
          <input
            id="level-count"
            type="number"
            min="2"
            max="15"
            step="1"
            value="10"
            required
          />
          <label for="photo-files" data-i18n="添加照片（最多 15 张）"
            >添加照片（最多 15 张）</label
          >
          <div class="photo-upload">
            <input
              id="photo-files"
              class="photo-upload-input"
              type="file"
              accept="image/*"
              multiple
              aria-describedby="photo-status"
            />
            <span class="photo-upload-icon" aria-hidden="true">＋</span>
            <strong data-i18n="选择照片">选择照片</strong>
            <span data-i18n="最多 15 张 · 自动圆形裁剪"
              >最多 15 张 · 自动圆形裁剪</span
            >
          </div>
          <p id="photo-status" role="status"></p>
          <ol id="photo-list" class="photo-list"></ol>
          <button
            id="play-custom"
            class="primary-button"
            type="submit"
            disabled
            data-i18n="使用这个主题开始"
          >
            使用这个主题开始
          </button>
        </form>
      </div>
    </section>
    <section
      id="level-screen"
      class="theme-screen"
      hidden
      aria-labelledby="level-heading"
    >
      <div class="theme-panel">
        <button
          id="preview-back"
          class="secondary-button"
          type="button"
          data-i18n="返回主题"
        >
          返回主题
        </button>
        <p class="eyebrow" data-i18n="等级预览">等级预览</p>
        <h1 id="level-heading"></h1>
        <p data-i18n="从小到大，查看每个合成等级。">
          从小到大，查看每个合成等级。
        </p>
        <p data-i18n="点击任意图片调整裁剪。修改仅保存在此浏览器。">
          点击任意图片调整裁剪。修改仅保存在此浏览器。
        </p>
        <ol id="level-preview-list" class="level-previews"></ol>
        <p id="preview-status" role="status"></p>
        <button
          id="preview-play"
          type="button"
          class="primary-button"
          disabled
          data-i18n="开始游戏"
        >
          开始游戏
        </button>
      </div>
    </section>
    <dialog id="crop-dialog" class="crop-dialog" aria-labelledby="crop-title">
      <h2 id="crop-title" data-i18n="调整圆形裁剪">调整圆形裁剪</h2>
      <canvas
        id="crop-preview"
        width="320"
        height="320"
        aria-label="圆形裁剪预览"
        data-i18n-label="圆形裁剪预览"
      ></canvas>
      <label for="crop-zoom" data-i18n="缩放">缩放</label
      ><input
        id="crop-zoom"
        type="range"
        min="0.5"
        max="4"
        step="0.01"
        value="1"
      />
      <label for="crop-x" data-i18n="水平位置">水平位置</label
      ><input
        id="crop-x"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.5"
      />
      <label for="crop-y" data-i18n="垂直位置">垂直位置</label
      ><input
        id="crop-y"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.5"
      />
      <div class="crop-actions">
        <button id="crop-cancel" type="button" data-i18n="取消">取消</button
        ><button
          id="crop-save"
          type="button"
          class="primary-button"
          data-i18n="保存裁剪"
        >
          保存裁剪
        </button>
      </div>
    </dialog>
    <main
      hidden
      id="app"
      class="game"
      aria-label="合成大迈乎"
      data-i18n-label="合成大迈乎"
    >
      <header id="top" class="game-toolbar">
        <label class="language-control" for="game-language"
          ><span data-i18n="语言">语言</span
          ><select id="game-language" class="language-select">
            <option value="zh">中文</option>
            <option value="fr">Français</option>
            <option value="en">English</option>
          </select></label
        >
        <button
          type="button"
          id="choose-theme"
          class="restart-button"
          data-i18n="主题"
        >
          主题
        </button>
        <div class="score">
          <span data-i18n="分数">分数</span><b id="sc">0</b>
        </div>
        <div class="score">
          <span data-i18n="最高分">最高分</span><b id="best">0</b>
        </div>
        <button
          type="button"
          id="snd"
          class="sound-button"
          aria-label="音效"
          data-i18n-label="音效"
        >
          🔊
        </button>
        <button type="button" id="re" class="restart-button" data-i18n="重来">
          重来
        </button>
      </header>
      <div id="wrap" class="game-board">
        <canvas
          id="c"
          aria-label="游戏区域"
          data-i18n-label="游戏区域"
          data-i18n="使用左右方向键移动，空格或向下方向键投放。"
          >使用左右方向键移动，空格或向下方向键投放。</canvas
        >
        <div id="over" class="game-over">
          <h2 data-i18n="游戏结束">游戏结束</h2>
          <p><span data-i18n="本局得分">本局得分</span> <b id="fs">0</b></p>
          <button type="button" id="again" data-i18n="再来一局">
            再来一局
          </button>
        </div>
      </div>
    </main>

    <script src="scripts/themes.js"></script>
    <script src="scripts/game.js"></script>
    <script src="scripts/theme-picker.js"></script>
  </body>
</html>
